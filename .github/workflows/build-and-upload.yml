name: Build and Upload to itch.io

on:
  push:
    branches: [ main, master, claude/happy-darwin-6dadcx ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Godot and export templates
      run: |
        set -euo pipefail
        base="https://github.com/godotengine/godot/releases/download/4.7.2-stable"

        mkdir -p ~/godot/bin
        wget -q -O /tmp/godot.zip "$base/Godot_v4.7.2-stable_linux.x86_64.zip"
        unzip -q /tmp/godot.zip -d ~/godot/bin
        chmod +x ~/godot/bin/Godot_v4.7.2-stable_linux.x86_64
        ln -sf ~/godot/bin/Godot_v4.7.2-stable_linux.x86_64 godot

        templates=~/.local/share/godot/export_templates/4.7.2.stable
        mkdir -p "$templates"
        wget -q -O /tmp/templates.tpz "$base/Godot_v4.7.2-stable_export_templates.tpz"
        unzip -qj /tmp/templates.tpz 'templates/*' -d "$templates"
        rm -f /tmp/godot.zip /tmp/templates.tpz

    - name: Import resources
      run: ./godot --headless --import .

    - name: Build Linux export
      run: |
        mkdir -p build/itch/linux
        ./godot --headless --export-release "Linux" "build/itch/linux/winter-warrior"
        chmod +x build/itch/linux/winter-warrior
        printf '[[actions]]\nname = "play"\npath = "winter-warrior"\n' > build/itch/linux/.itch.toml
        ls -la build/itch/linux

    - name: Build Web export
      run: |
        mkdir -p build/itch/web
        ./godot --headless --export-release "Web" "build/itch/web/index.html"

    - name: Download butler
      run: |
        set -euo pipefail
        curl -fsSL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
        unzip -q butler.zip butler
        chmod +x butler
        ./butler -V

    - name: Upload to itch.io
      env:
        BUTLER_API_KEY: ${{ secrets.ITCH_TOKEN }}
      run: |
        set -euo pipefail
        if [ -z "$BUTLER_API_KEY" ]; then
          echo "::error::ITCH_TOKEN secret is not set (Settings -> Secrets and variables -> Actions)"
          exit 1
        fi
        version="$(grep -oP 'VERSION := "\K[^"]+' src/build_info.gd)-${GITHUB_SHA::7}"
        echo "Uploading $version to itch.io"
        ./butler push build/itch/linux outerheavenx/winter-warrior:linux --userversion "$version"
        ./butler push build/itch/web outerheavenx/winter-warrior:web --userversion "$version"
