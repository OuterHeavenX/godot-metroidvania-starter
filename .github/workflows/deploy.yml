name: Export and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Required by actions/deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  GODOT_VERSION: 4.7.2
  EXPORT_PRESET: Web

jobs:
  export:
    name: Export web build
    runs-on: ubuntu-latest
    outputs:
      has_source: ${{ steps.detect.outputs.has_source }}
    steps:
      - uses: actions/checkout@v7

      # Nothing to build is not a failure. Skip cleanly when the project source
      # has not been pushed yet, but fail loudly if a project is half-present —
      # src/ without project.godot means something was deleted by mistake.
      - name: Detect the project source
        id: detect
        run: |
          set -euo pipefail
          if [ -f project.godot ]; then
            echo "has_source=true" >> "$GITHUB_OUTPUT"
          elif [ -d src ]; then
            echo "::error::src/ exists but project.godot is missing. The project is incomplete — restore project.godot."
            exit 1
          else
            echo "has_source=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Godot project source in this repository yet, so there is nothing to export. See 'Adding the project source' in README.md."
          fi

      - name: Cache Godot editor and export templates
        if: steps.detect.outputs.has_source == 'true'
        id: godot-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/godot/bin
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-web

      - name: Install Godot ${{ env.GODOT_VERSION }}
        if: steps.detect.outputs.has_source == 'true' && steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"

          mkdir -p ~/godot/bin
          curl -fsSL -o /tmp/godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot/bin

          # The .tpz carries every platform (~1.3 GB unpacked). Keep only the
          # web templates so the cache stays small.
          templates=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$templates"
          curl -fsSL -o /tmp/templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -qj /tmp/templates.tpz 'templates/web*' 'templates/version.txt' -d "$templates"

          rm -f /tmp/godot.zip /tmp/templates.tpz

      - name: Put godot on PATH
        if: steps.detect.outputs.has_source == 'true'
        run: |
          set -euo pipefail
          ln -sf "$HOME/godot/bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$HOME/godot/bin/godot"
          chmod +x "$HOME/godot/bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          echo "$HOME/godot/bin" >> "$GITHUB_PATH"

      - name: Check the export preset exists
        if: steps.detect.outputs.has_source == 'true'
        run: |
          set -euo pipefail
          if [ ! -f export_presets.cfg ]; then
            echo "::error::export_presets.cfg is missing. Commit it — CI reads the '${EXPORT_PRESET}' preset from it to build the web export."
            exit 1
          fi
          if ! grep -qx "name=\"${EXPORT_PRESET}\"" export_presets.cfg; then
            echo "::error::No export preset named '${EXPORT_PRESET}'. Presets found:"
            grep '^name=' export_presets.cfg || true
            exit 1
          fi

      - name: Import resources
        if: steps.detect.outputs.has_source == 'true'
        run: godot --headless --import .

      - name: Check every script compiles
        if: steps.detect.outputs.has_source == 'true'
        # godot --export-release exits 0 on a broken script, and
        # --check-only --script cannot resolve autoload references, so neither
        # works as a gate. This loads every script inside the running project.
        run: |
          set -euo pipefail
          out=$(timeout 300 godot --headless --scene res://tests/runners/check_scripts.tscn 2>&1) || true
          echo "$out" | grep -E 'SCRIPT (ERROR|CHECK)|Parse Error' || true
          echo "$out" | grep -q 'SCRIPT CHECK OK'

      - name: Run the game's test suites
        if: steps.detect.outputs.has_source == 'true'
        run: |
          set -euo pipefail
          status=0
          for runner in tests/runners/run_*.tscn; do
            [ -e "$runner" ] || continue
            name=$(basename "$runner" .tscn)
            echo "::group::$name"
            out=$(timeout 300 godot --headless --scene "res://$runner" 2>&1) || true
            echo "$out"
            echo "::endgroup::"
            # Suites print either "ALL TESTS PASSED" or "<NAME> TESTS ALL PASSED".
            if echo "$out" | grep -qE '(ALL TESTS PASSED|TESTS ALL PASSED)'; then
              echo "$name: passed"
            else
              echo "::error::$name failed"
              echo "$out" | grep -E '^(FAIL|FAILURES|  fail)' || true
              status=1
            fi
          done
          exit $status

      - name: Export web build
        if: steps.detect.outputs.has_source == 'true'
        run: |
          set -euo pipefail
          mkdir -p build/web
          godot --headless --export-release "${EXPORT_PRESET}" build/web/index.html

      - name: Verify the build output
        if: steps.detect.outputs.has_source == 'true'
        run: |
          set -euo pipefail
          for f in index.html index.js index.wasm index.pck; do
            if [ ! -s "build/web/$f" ]; then
              echo "::error::export produced no build/web/$f"
              exit 1
            fi
          done
          ls -la build/web

      - name: Upload Pages artifact
        if: steps.detect.outputs.has_source == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/web

  deploy:
    name: Deploy to GitHub Pages
    needs: export
    # Pull requests build but do not publish. Skipping when nothing was
    # exported matters: deploying an empty artifact would blank the live site.
    if: >-
      needs.export.outputs.has_source == 'true'
      && github.ref == 'refs/heads/main'
      && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
