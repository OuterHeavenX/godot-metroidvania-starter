<!DOCTYPE html>
<meta charset="utf-8">
<title>Metroidvania Starter</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  Fallback entry point.

  The playable build lives in docs/, which is what Pages serves when its
  folder is set to /docs. If Pages is instead serving the repository root,
  this page forwards to the game so the canonical URL still works. When the
  folder is /docs this file is never served at all.
-->
<meta http-equiv="refresh" content="0; url=./docs/">
<style>
  html { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #0a0d18; color: #cfe0ff; text-align: center;
    font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  a { color: #8fb8ff; }
</style>
<body>
  <p>Loading <strong>Metroidvania Starter</strong>…<br>
  <a href="./docs/">Play it here</a> if you are not redirected.</p>
</body>
